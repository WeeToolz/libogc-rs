[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gc-elf = { path = "../crates/tools/gc-elf" }
libc = "0.2"
modplay-capi = { path = "../crates/abi/modplay-capi" }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
